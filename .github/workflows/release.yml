name: 发布构建

# 打 tag（v*）时构建全部平台产物，汇总成一个 draft release 等人确认。
# 为什么 macOS 的 App 必须在这里构建：.app/.dmg 只能在 macOS 上产出，
# 本地 Windows 机器做不了（详见 docs/BUILD.md）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（留空则只跑构建不发布）'
        required: false

permissions:
  contents: write

jobs:
  agent:
    name: Agent 五平台
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端并嵌入
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          rm -rf agent/internal/webui/dist
          mkdir -p agent/internal/webui/dist
          cp -r web/dist/. agent/internal/webui/dist/
          touch agent/internal/webui/dist/.gitkeep

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: agent/go.sum

      - name: 交叉编译
        working-directory: agent
        run: |
          set -e
          LDFLAGS="-s -w"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS -H windowsgui" -o dist/landeck-agent-windows-amd64.exe .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/landeck-agent-windows-amd64-console.exe .
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/landeck-agent-linux-amd64 .
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/landeck-agent-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/landeck-agent-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/landeck-agent-darwin-arm64 .
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: agent/dist/*
          if-no-files-found: error

  desktop:
    name: 桌面端 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: 安装依赖
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir app install --frozen-lockfile

      # 分成两步：Tauri 只要看到 APPLE_CERTIFICATE 这个变量存在就当作「要签名」，
      # 而未配置的 GitHub secret 会展开成空字符串（变量仍在）—— 实测会导致：
      #   failed to import the signing certificate as a PKCS#12 (.p12) file
      # 所以只有真配了证书才注入这些变量。
      - name: 构建（未签名）
        if: env.HAS_APPLE_CERT != 'true'
        working-directory: app
        run: |
          echo "未配置 Apple 证书，产出未签名包（macOS 用户首次打开需去隔离）"
          pnpm exec tauri build ${{ matrix.args }}

      - name: 构建（签名 + 公证）
        if: env.HAS_APPLE_CERT == 'true'
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/deb/*.deb
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 用 runner 预装的 SDK，只补 NDK。
      # 自己再下一份并设 ANDROID_HOME 会与 runner 的 ANDROID_SDK_ROOT 冲突：
      #   Several environment variables ... contain different paths to the SDK
      - name: 安装 NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "使用 SDK: $SDK"
          SDKMGR="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "ndk;27.0.12077973" > /dev/null
          NDK="$SDK/ndk/27.0.12077973"
          test -d "$NDK" || { echo "NDK 没装上：$NDK" >&2; exit 1; }
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 安装依赖
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir app install --frozen-lockfile

      - name: 生成 Android 工程
        working-directory: app
        run: pnpm exec tauri android init --ci

      - name: 构建 APK
        working-directory: app
        run: pnpm exec tauri android build --apk --target aarch64

      - name: 签名 APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          UNSIGNED=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" /tmp/aligned.apk
          # 用 CI 里现生成的 keystore；正式发布请换成仓库 Secrets 里的固定 keystore，
          # 否则每次构建签名不同，用户无法覆盖安装。
          keytool -genkeypair -keystore /tmp/release.keystore -alias landeck -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass "${{ secrets.ANDROID_STORE_PASSWORD || 'landeck-ci' }}" \
            -keypass "${{ secrets.ANDROID_STORE_PASSWORD || 'landeck-ci' }}" \
            -dname "CN=LanDeck, O=LanDeck, C=CN"
          "$BT/apksigner" sign --ks /tmp/release.keystore \
            --ks-pass pass:"${{ secrets.ANDROID_STORE_PASSWORD || 'landeck-ci' }}" \
            --key-pass pass:"${{ secrets.ANDROID_STORE_PASSWORD || 'landeck-ci' }}" \
            --ks-key-alias landeck --out /tmp/landeck.apk /tmp/aligned.apk
          "$BT/apksigner" verify /tmp/landeck.apk
          cp /tmp/landeck.apk "landeck-android-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: landeck-android-*.apk
          if-no-files-found: error

  release:
    name: 汇总发布
    needs: [agent, desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总资产
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*.AppImage' -o -name '*.apk' \
            -o -name 'landeck-agent-*' \) -exec cp {} out/ \;
          # 先删掉各 job 带来的旧校验和：`sha256sum *` 会把刚重定向出的空文件也算进去
          rm -f out/SHA256SUMS.txt
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # draft: false —— 之前用 draft，结果是「发版了但用户看不到」，还得手动去后台点发布。
      # 按项目规矩（未经批准只发预测试版），这里固定 prerelease，但**直接可见**。
      - name: 发布 pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: "LanDeck ${{ github.ref_name }}（预测试版）"
          draft: false
          prerelease: true
          files: out/*
          generate_release_notes: true
