name: 构建检查

# 这里只做「能不能构建」和「笔记门禁」，不等于实测。
# 真正的功能验证在本机跑：tools/smoke.mjs（真浏览器 + 真 Agent）+ 三平台编译产物人工点验。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装并构建前端
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: 前端类型检查
        run: pnpm --dir web exec tsc --noEmit -p tsconfig.app.json

      - name: 把前端产物嵌进 Agent
        run: |
          rm -rf agent/internal/webui/dist
          mkdir -p agent/internal/webui/dist
          cp -r web/dist/. agent/internal/webui/dist/
          touch agent/internal/webui/dist/.gitkeep

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: agent/go.sum

      - name: go vet
        working-directory: agent
        run: go vet ./...

      - name: 三平台交叉编译
        working-directory: agent
        run: |
          set -e
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o /tmp/landeck-$(echo $target | tr / -) .
          done
          ls -la /tmp/landeck-*

      - name: 决策笔记门禁
        run: |
          node .agents/skills/agent-notes/scripts/verify-agent-note-tree.ts
          node .agents/skills/agent-notes/scripts/verify-agent-note-format.ts
          node .agents/skills/agent-notes/scripts/verify-archived-agent-notes.ts
