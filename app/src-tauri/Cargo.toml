[package]
name = "landeck"
version = "1.0.20"
description = "LanDeck 控制端"
authors = ["LanDeck"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "landeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# 与 tauri-plugin-updater 相同的验签实现：测试直接验证「公钥+安装包+签名」全链
minisign-verify = "=0.3.0"
base64 = "=0.22.1"

[profile.release]
opt-level = "z"    # 体积优先
lto = true
codegen-units = 1
panic = "abort"
strip = true
